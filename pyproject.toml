[project]
name = "tutorandquizbot"
version = "0.1.0"
description = "Privacy-preserving local network-security tutor and quiz generator"
readme = "README.md"
requires-python = ">=3.12,<3.13"

# Everything the implemented pipeline needs at runtime. faiss and numpy joined
# this set when embedding and indexing stopped being hypothetical: the `indexed`
# outcome is unreachable without them, which makes them as core as pypdf.
dependencies = [
    "ollama>=0.4.0",      # client for the local Ollama runtime (loopback only)
    "pypdf>=5.0.0",       # PDF text extraction for the ingest pipeline
    "keyring>=25.0.0",    # OS keychain access for the index encryption key
    "cryptography>=43.0", # AES-256-GCM for the bonus encrypted index (R2)
    "faiss-cpu>=1.15.0",  # IndexFlatIP + serialize_index (TUT-58)
    "numpy>=2.0",         # faiss's array interface; imported directly, so declared
]

[project.optional-dependencies]
# Declared but deliberately NOT installed yet: there is no UI module, so the
# pipeline is driven from ingest/cli.py. Install with: uv sync --extra ui
ui = [
    "streamlit>=1.39.0",
]

[dependency-groups]
# Installed by default on `uv sync`, so every teammate gets the hook tooling
# without a separate step. Pure Python, so it works on all three OSes with no
# Go toolchain, which rules out gitleaks as the local hook.
dev = [
    "pre-commit>=4.0.0",
    "detect-secrets>=1.5.0",
    "pytest>=8.0.0",
]

[tool.uv]
# Keep the lockfile resolvable for every teammate's platform, not just the one
# that happened to run `uv lock`.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
    "sys_platform == 'win32'",
]

[tool.pytest.ini_options]
# The repo root must be importable: there is no [build-system], so this is a uv
# virtual project and `ingest` is never installed into .venv. Without this,
# pytest's prepend import mode puts only tests/ on sys.path and `import ingest`
# fails.
pythonpath = ["."]
testpaths = ["tests"]
