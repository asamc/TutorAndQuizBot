name: CI

# Scope note: no linting yet, and no test of the agents or retrieval, which do
# not exist. This workflow enforces the R3 secret-scanning requirement
# (docs/threat-model.md section 5.3), guards dependency drift, runs the test
# suite, and verifies the environment builds on all three team operating
# systems.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # Escape hatch for the matrix job below, whose `if:` gate otherwise only
  # fires on a pull request into main or the resulting merge commit. Lets the
  # expensive macOS/Windows legs be exercised on demand from any branch:
  #   gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs the whole history, not just the tip commit.
          fetch-depth: 0

      # Run gitleaks via its Docker image rather than gitleaks-action, which
      # requires a paid GITLEAKS_LICENSE for organization-owned repos. This is
      # the exact command and pinned version verified locally against this
      # repository's history. --redact keeps any finding out of the CI log.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact

  deps:
    name: Lockfile and manifest integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv.lock is in sync with pyproject.toml
        run: uv lock --check

      # The export header embeds the command line, so the -o path must match
      # the committed filename exactly or this produces a spurious diff.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --format requirements-txt --no-hashes \
            --no-emit-project --no-dev -o requirements.txt
          git diff --exit-code -- requirements.txt

  tests:
    name: Tests
    # Deliberately NOT gated to pull requests, unlike the matrix job below.
    # ubuntu bills at 1x and the suite takes seconds, so it runs on every push
    # -- otherwise the contract test would only run when a PR opens, which is
    # too late to be useful while building on a branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build the environment from the lockfile
        run: uv sync --locked

      # Guards the contract in docs/ingest-interface.md section 3 against
      # drifting from ingest/model.py. The UI is built against that document.
      - name: pytest
        run: uv run pytest -q

  environment:
    name: Environment (${{ matrix.os }})
    # This repository is private: macOS runners bill at 10x and Windows at 2x
    # against the free 2,000 minutes/month. The cheap Linux jobs above run on
    # every push, but the matrix is limited to pull requests into main plus the
    # merge commit on main itself.
    #
    # Merging a PR fires a `push` event on main, NOT a `pull_request` event, so
    # the second clause is what covers the merge -- without it the matrix only
    # ever runs on the PR before it lands. The third clause is the manual
    # escape hatch declared in the `on:` block at the top of this file.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # --locked fails if uv.lock is stale rather than silently updating it.
      - name: Build the environment from the lockfile
        run: uv sync --locked

      - name: Interpreter must be 3.12
        shell: bash
        run: |
          uv run python -c "import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)"

      # Proves the Ollama client imports on this platform. It does not contact
      # a model: pulling 2 GB per run would be wasteful, and the loopback bind
      # check in the README is inherently a local check.
      - name: Runtime dependencies import
        shell: bash
        run: |
          uv run python -c "import ollama, pypdf, keyring, cryptography; print('imports OK')"

      # The suite also runs on ubuntu in the `tests` job on every push. Running
      # it here adds the macOS and Windows coverage that TUT-11 needs.
      - name: pytest
        shell: bash
        run: uv run pytest -q
